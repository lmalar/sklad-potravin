{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4">Upravit produkt</h4>
                <form method="POST" action="{{ url_for('edit', id=item.id) }}">
                    <div class="mb-3">
                        <label class="form-label">Čárový kód (EAN)</label>
                        <input type="text" class="form-control" name="barcode" value="{{ item.barcode or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Název produktu</label>
                        <input type="text" class="form-control" name="name" value="{{ item.name }}" required>
                    </div>
                    <div class="row">
                        <div class="col-4 mb-3">
                            <label class="form-label">Kusů / Balení</label>
                            <input type="number" min="1" class="form-control" name="count" value="{{ item.count }}" required>
                        </div>
                        <div class="col-4 mb-3">
                            <label class="form-label">Velikost</label>
                            <input type="number" step="0.01" class="form-control" name="package_size" value="{{ item.package_size or '' }}">
                        </div>
                        <div class="col-4 mb-3">
                            <label class="form-label">Jednotka</label>
                            <select class="form-select" name="unit">
                                <option value="ks" {% if item.unit == 'ks' %}selected{% endif %}>ks</option>
                                <option value="g" {% if item.unit == 'g' %}selected{% endif %}>g</option>
                                <option value="kg" {% if item.unit == 'kg' %}selected{% endif %}>kg</option>
                                <option value="ml" {% if item.unit == 'ml' %}selected{% endif %}>ml</option>
                                <option value="l" {% if item.unit == 'l' %}selected{% endif %}>l</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Sklad / Umístění</label>
                            <input type="text" class="form-control" name="location" list="locations" value="{{ item.location }}" required>
                            <datalist id="locations">
                                {% for loc in locations %}
                                <option value="{{ loc }}">
                                {% endfor %}
                            </datalist>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Expirace</label>
                            <input type="month" class="form-control" name="expiration" value="{{ item.expiration.strftime('%Y-%m') if item.expiration else '' }}">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">Zrušit</a>
                        <button type="submit" class="btn btn-primary px-4">Uložit změny</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
